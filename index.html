<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>a-startpage</title>
</head>

<body class="text-ctp-text bg-ctp-mantle">
  <script type="module" src="/src/main.js"></script>

  <main class="relative min-h-screen flex items-center justify-center">

    <div class="absolute bottom-4 right-4">
      <button id="settings" class="settings-button flex items-center"><iconify-icon icon="material-symbols:settings"
          class="mr-2"></iconify-icon>Settings</button>
    </div>

    <div class="w-[85%] mx-auto grid gap-y-5" style="grid-template-columns: 160px 1fr; grid-template-rows: 44px 420px;">

      <!-- Search bar with terminal prompt -->
      <div class="col-span-2 search-prompt">
        <span class="prompt-path text-ctp-surface1">~/google</span>
        <span class="prompt-chevron text-ctp-mauve">›</span>
        <form id="search-form" action="https://www.google.com/search" method="GET">
          <input type="text" name="q" class="search-input text-ctp-text" placeholder="search the web..." />
        </form>
      </div>

      <!-- Tab sidebar -->
      <div class="tabbed-container flex flex-col overflow-hidden">
      </div>

      <!-- Tab content panels -->
      <div class="tab-board overflow-hidden relative">
      </div>

    </div>
  </main>

  <!-- Settings modal -->
  <div id="settings-modal" class="modal-backdrop fixed inset-0 bg-black/50 z-[100] items-center justify-center">
    <form id="settings-form" class="bg-ctp-base border border-ctp-surface0 rounded-md w-[420px] shadow-[0_8px_48px_rgba(0,0,0,0.6)]">

      <div class="flex items-center justify-between px-[18px] py-[14px] border-b border-ctp-surface0">
        <span class="text-[11px] font-medium tracking-[0.14em] uppercase text-ctp-subtext">settings</span>
        <button type="button" id="settings-close" class="bg-transparent border-none text-ctp-surface1 text-xs leading-none px-1 cursor-pointer transition-colors hover:text-ctp-text">✕</button>
      </div>

      <div class="p-[18px] flex flex-col gap-6">

        <section class="flex flex-col gap-[10px]">
          <h2 class="text-[9px] font-semibold tracking-[0.18em] uppercase text-ctp-surface2 mb-0.5">general</h2>
          <div class="flex items-center justify-between text-xs text-ctp-subtext">
            <label for="search-engine">Search engine</label>
            <select id="search-engine" name="search-engine" class="bg-ctp-mantle border border-ctp-surface0 text-ctp-text text-[11px] rounded px-2 py-1 outline-none cursor-pointer"></select>
          </div>
          <div class="flex items-center justify-between text-xs text-ctp-subtext">
            <label for="open-in-new-tab">Open links in new tab</label>
            <input id="open-in-new-tab" name="open-in-new-tab" type="checkbox" value="true" class="size-3.5 accent-ctp-mauve cursor-pointer" />
          </div>
        </section>

        <section class="flex flex-col gap-[10px]">
          <h2 class="text-[9px] font-semibold tracking-[0.18em] uppercase text-ctp-surface2 mb-0.5">appearance</h2>
          <div class="flex items-center justify-between text-xs text-ctp-subtext">
            <label for="accent-color">Accent color</label>
            <select id="accent-color" name="accent-color" class="bg-ctp-mantle border border-ctp-surface0 text-ctp-text text-[11px] rounded px-2 py-1 outline-none cursor-pointer">
              <option value="mauve">mauve</option>
              <option value="blue">blue</option>
              <option value="teal">teal</option>
              <option value="green">green</option>
              <option value="peach">peach</option>
            </select>
          </div>
        </section>

      </div>

      <div class="px-[18px] py-3 border-t border-ctp-surface0 flex justify-end">
        <button type="submit" id="settings-save" class="text-[11px] font-medium tracking-[0.1em] uppercase text-ctp-crust bg-ctp-mauve border-none rounded px-4 py-1.5 cursor-pointer transition-all hover:brightness-110 active:brightness-90">Save</button>
      </div>

    </form>
  </div>
</body>

</html>
