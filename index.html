<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>a-startpage</title>
</head>

<body class="text-ctp-text bg-ctp-mantle">
  <script type="module" src="/src/main.js"></script>

  <main class="relative min-h-screen flex items-center justify-center">

    <div class="absolute top-4 right-4">
      <button id="settings" class="settings-button flex items-center"><iconify-icon icon="material-symbols:settings"
          class="mr-2"></iconify-icon>Settings</button>
    </div>

    <div class="w-[85%] mx-auto grid gap-y-5" style="grid-template-columns: 160px 1fr; grid-template-rows: 44px 420px;">

      <!-- Search bar with terminal prompt -->
      <div class="col-span-2 search-prompt">
        <span class="prompt-path text-ctp-surface1">~/google</span>
        <span class="prompt-chevron text-ctp-mauve">›</span>
        <form action="https://www.google.com/search" method="GET">
          <input type="text" name="q" class="search-input text-ctp-text" placeholder="search the web..." />
        </form>
      </div>

      <!-- Tab sidebar -->
      <div class="tabbed-container flex flex-col overflow-hidden">
      </div>

      <!-- Tab content panels -->
      <div class="tab-board overflow-hidden relative">
      </div>

    </div>
  </main>
</body>

</html>
