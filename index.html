<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>a-startpage</title>
</head>

<body>
  <script type="module" src="/src/main.js"></script>

  <main>
    <div class="settings">
      <button class="settings-button" id="settings">Settings</button>
    </div>
    <div class="container">
      <div class="search">
        <form action="https://www.google.com/search" method="GET">
          <input type="text" name="q" class="search-input" placeholder="Search Google" />
        </form>
      </div>
      <!-- Tab links -->
      <div class="tabbed-container">
        <button class="tablinks" data-city="London">London</button>
        <button class="tablinks" data-city="Paris">Paris</button>
        <button class="tablinks" data-city="Tokyo">Tokyo</button>
      </div>

      <!-- Tab content -->
      <div id="London" class="tabcontent">
        <div class="links" id="links">
        </div>
      </div>

      <div id="Paris" class="tabcontent">
        <h3>Paris</h3>
        <p>Paris is the capital of France.</p>
      </div>

      <div id="Tokyo" class="tabcontent">
        <h3>Tokyo</h3>
        <p>Tokyo is the capital of Japan.</p>
      </div>
    </div>
  </main>
</body>

</html>
