<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>a-startpage</title>
</head>

<body class="text-ctp-text bg-ctp-mantle">
  <script type="module" src="/src/main.js"></script>

  <main class="relative min-h-screen flex flex-col items-center">

    <div id="header" class="flex-1 flex items-center justify-center w-full">
      <div class="flex items-center gap-10">
        <img id="banner" />
        <div class="flex flex-col gap-4">
          <div id="clock-display" class="select-none">
            <div id="clock-time"></div>
            <div id="clock-date"></div>
          </div>
          <hr class="border-ctp-surface0" />
          <div id="poetry"
            class="text-[11px] font-light tracking-[0.04em] text-ctp-surface2 whitespace-pre leading-[1.7]">
          </div>
        </div>
      </div>
      <div id="calendar" class="absolute top-4 right-4 h-full"></div>
    </div>

    <div class="flex-1 flex justify-center w-full">
      <div class="w-[65%] max-w-7xl mx-auto grid gap-y-5"
        style="grid-template-columns: 160px 1fr; grid-template-rows: 44px 420px;">

        <!-- Search bar with terminal prompt -->
        <div class="col-span-2 search-prompt">
          <span class="prompt-path text-ctp-surface1">~/google</span>
          <span class="prompt-chevron text-ctp-mauve">›</span>
          <form id="search-form" action="https://www.google.com/search" method="GET">
            <input type="text" name="q" class="search-input text-ctp-text" placeholder="search the web..." />
          </form>
        </div>

        <!-- Tab sidebar -->
        <div class="tabbed-container flex flex-col overflow-hidden">
        </div>

        <!-- Tab content panels -->
        <div class="tab-board overflow-hidden relative">
        </div>

      </div>
    </div>

    <!-- Add-entry and Settings -->
    <div class="absolute bottom-4 right-4 z-10 flex gap-3">
      <button id="add-bookmark" class="settings-button flex items-center"><iconify-icon icon="tabler:bookmark-filled"
          class="mr-2"></iconify-icon>Add bookmarks</button>
      <button id="settings" class="settings-button flex items-center"><iconify-icon icon="material-symbols:settings"
          class="mr-2"></iconify-icon>Settings</button>
    </div>

  </main>

  <!-- Settings modal -->
  <div id="settings-modal" class="modal-backdrop fixed inset-0 bg-black/50 z-[100] items-center justify-center">
    <form id="settings-form"
      class="bg-ctp-base border border-ctp-surface0 rounded-md w-[800px] shadow-[0_8px_48px_rgba(0,0,0,0.6)]">

      <div class="flex items-center justify-between px-6 py-5 border-b border-ctp-surface0">
        <span class="text-sm font-medium tracking-[0.14em] uppercase text-ctp-subtext">settings</span>
        <button type="button" id="settings-close"
          class="bg-transparent border-none text-ctp-surface1 text-base leading-none px-1 cursor-pointer transition-colors hover:text-ctp-text">✕</button>
      </div>

      <div class="p-6 flex flex-col gap-7">

        <section class="flex flex-col gap-4">
          <h2 class="text-[11px] font-semibold tracking-[0.18em] uppercase text-ctp-surface2 mb-0.5">general</h2>
          <div class="flex items-center justify-between text-sm text-ctp-subtext">
            <label for="search-engine">Search engine</label>
            <select id="search-engine" name="search-engine" data-type="string"
              class="appearance-none bg-ctp-mantle border border-ctp-surface0 text-ctp-text text-sm rounded px-3 py-1.5 outline-none cursor-pointer"></select>
          </div>
          <div class="flex items-center justify-between text-sm text-ctp-subtext">
            <label for="open-in-new-tab">Open links in new tab</label>
            <input id="open-in-new-tab" name="open-in-new-tab" type="checkbox" value="true" data-type="boolean"
              class="size-4 accent-ctp-mauve cursor-pointer" />
          </div>
          <div class="flex items-center justify-between text-sm text-ctp-subtext">
            <label for="open-in-new-tab">Show seconds</label>
            <input id="show-seconds" name="show-seconds" type="checkbox" value="true" data-type="boolean"
              class="size-4 accent-ctp-mauve cursor-pointer" />
          </div>
        </section>

        <section class="flex flex-col gap-4">
          <h2 class="text-[11px] font-semibold tracking-[0.18em] uppercase text-ctp-surface2 mb-0.5">appearance</h2>
          <div class="text-sm text-ctp-subtext">
            <div id="banner-select" class="label mb-5">Change banner</div>
            <div class="swiper" id="img-picker">
              <div class="swiper-wrapper"></div>
              <div class="swiper-button-next"></div>
              <div class="swiper-button-prev"></div>
              <div class="swiper-pagination"></div>
            </div>
          </div>
          <!-- <div class="flex items-center justify-between text-sm text-ctp-subtext"> -->
          <!--   <label for="accent-color">Accent color</label> -->
          <!--   <select id="accent-color" name="accent-color" -->
          <!--     class="appearance-none bg-ctp-mantle border border-ctp-surface0 text-ctp-text text-sm rounded px-3 py-1.5 outline-none cursor-pointer"> -->
          <!--     <option value="mauve">mauve</option> -->
          <!--     <option value="blue">blue</option> -->
          <!--     <option value="teal">teal</option> -->
          <!--     <option value="green">green</option> -->
          <!--     <option value="peach">peach</option> -->
          <!--   </select> -->
          <!-- </div> -->
        </section>

      </div>

      <div class="px-6 py-4 border-t border-ctp-surface0 flex justify-end">
        <button type="submit" id="settings-save"
          class="text-sm font-medium tracking-[0.1em] uppercase text-ctp-crust bg-ctp-mauve border-none rounded px-5 py-2 cursor-pointer transition-all hover:brightness-110 active:brightness-90">Save</button>
      </div>

    </form>
  </div>

  <!-- Add-bookmark modal -->
  <div id="jsoneditor-modal" class="modal-backdrop fixed inset-0 bg-black/50 z-[100] items-center justify-center">
    <div id="jsoneditor-content"
      class="bg-ctp-base border border-ctp-surface0 rounded-md w-[800px] shadow-[0_8px_48px_rgba(0,0,0,0.6)]">
    </div>
    <button type="submit" id="json-save"
      class="text-sm font-medium tracking-[0.1em] uppercase text-ctp-crust bg-ctp-mauve border-none rounded px-5 py-2 cursor-pointer transition-all hover:brightness-110 active:brightness-90">Save</button>
  </div>
</body>

</html>
